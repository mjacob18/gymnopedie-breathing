<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__FONTS__">
<style>
/* Presentation layout for screen sharing: one screen, the circle fills it, the breath trace and a slim control bar below. Piece colors come from the build. */
__TOKENS__
:root { --f-body: "Jost", "Futura", "Avenir Next", system-ui, sans-serif; --f-mono: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; --breath: rgb(var(--breath-rgb)); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; }
.app { height: 100%; max-width: 1280px; margin: 0 auto; padding-inline: 24px; padding-block: 16px 18px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; gap: 12px; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-style: var(--display-style); font-weight: var(--display-weight); font-size: clamp(20px, 3vh, 30px); margin: 0; }
.rate { font-family: var(--f-mono); font-size: clamp(14px, 2vh, 18px); color: var(--muted); font-variant-numeric: tabular-nums; }
.rate b { font-weight: 500; color: var(--ink); }

.dial { position: relative; min-height: 0; }
.dial canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cue { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.cue-word { font-family: var(--f-display); font-style: var(--display-style); font-weight: var(--display-weight); font-size: clamp(24px, 5vh, 56px); line-height: 1.1; }
.cue-count { font-family: var(--f-mono); font-size: clamp(14px, 2.4vh, 22px); color: var(--muted); margin-top: .4em; font-variant-numeric: tabular-nums; }
.cue-note { font-size: clamp(15px, 2.6vh, 22px); color: var(--ink); margin: .5em auto 0; min-height: 1.3em; max-width: min(90vw, 30ch); text-wrap: balance; line-height: 1.3; opacity: 0; }

#trace { width: 100%; height: clamp(48px, 9vh, 88px); display: block; background: var(--surface); border-radius: 6px; }

.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seek { flex: 1 1 260px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
#seek { width: 100%; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: var(--line); cursor: pointer; }
#seek::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); }
#seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); }
button, .filebtn { font: 500 15px var(--f-body); border-radius: 999px; padding: 9px 18px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.primary { background: var(--breath); border-color: var(--breath); color: var(--bg); }
#play { min-width: 92px; }
#fadeBtn { min-width: 122px; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, .filebtn:focus-within, select:focus-visible, input:focus-visible { outline: 2px solid var(--breath); outline-offset: 2px; }
.filebtn { position: relative; display: inline-block; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.hint { font-size: 14px; color: var(--ink); min-width: 0; }
.options { display: flex; gap: 12px 20px; flex-wrap: wrap; align-items: center; padding: 12px 14px; background: var(--surface); border-radius: 8px; font-size: 14px; }
select { font: 14px var(--f-body); padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
.check { display: flex; gap: 6px; align-items: center; }
.group { display: contents; }
@media (max-width: 600px) { .app { padding-inline: 16px; } }
/* optional stage light: a looping video behind the page, only on pages whose config asks for it */
#light, #fractal { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; z-index: 0; }
#fractal { filter: blur(0.5px); }
.app { position: relative; z-index: 1; }
.lit h1, .lit .rate, .lit .cue { text-shadow: 0 1px 14px rgb(0 0 0 / .8); }
.lit .cue-note { max-width: min(90vw, 44ch); }
</style>
</head>
<body>
<video id="light" muted loop playsinline preload="auto" aria-hidden="true" hidden></video>
<canvas id="fractal" aria-hidden="true" hidden></canvas>
<main class="app">
  <header>
    <h1>__HEADING__</h1>
    <div class="rate" id="rate">&nbsp;</div>
  </header>
  <div class="dial">
    <canvas id="circle" aria-hidden="true"></canvas>
    <div class="cue" id="cue" aria-live="polite"><div class="cue-word" id="cueWord">&nbsp;</div><div class="cue-count" id="cueCount">&nbsp;</div><div class="cue-note" id="cueNote"></div></div>
  </div>
  <canvas id="trace" aria-hidden="true"></canvas>
  <div class="options" id="options" hidden>
    <select id="mode" aria-label="Pacing"></select>
    <select id="split" aria-label="Out-breath length"><option value="even">Even breath</option><option value="long">Longer out-breath</option></select>
    <label class="check"><input type="checkbox" id="ripples" checked> Ripples</label>
    <label class="check" id="notesOpt" hidden><input type="checkbox" id="notesOn" checked> Guidance</label>
    <span class="group" id="bodyOpts" hidden>
      <label class="check"><input type="checkbox" id="bodyOn" checked> Body cues</label>
      <select id="sweep" aria-label="Body scan pace"><option value="4">Scan: 4 breaths per pass</option><option value="6">Scan: 6 breaths per pass</option><option value="8">Scan: 8 breaths per pass</option><option value="10">Scan: 10 breaths per pass</option><option value="12">Scan: 12 breaths per pass</option></select>
      <select id="pulse" aria-label="Heart pulse"><option value="breath">Heart: pulse with the breath</option><option value="heart">Heart: slow heartbeat</option></select>
    </span>
    <label class="filebtn" id="fileLabel">Choose MP3<input type="file" id="file" accept="audio/*,.mp3"></label>
  </div>
  <div class="bar">
    <button id="play" type="button" class="primary">Play</button>
    <button id="fadeBtn" type="button" disabled>Fade out</button>
    <div class="seek"><span id="tNow">0:00</span><input type="range" id="seek" min="0" step="0.1" value="0" aria-label="Position"><span id="tEnd">0:00</span></div>
    <span class="hint" id="hint" hidden></span>
    <button id="optBtn" type="button" aria-expanded="false" aria-controls="options">Options</button>
    <button id="fsBtn" type="button">Full screen</button>
  </div>
</main>

<script id="config" type="application/json">__CONFIG__</script>
<script>
(() => {
  const C = JSON.parse(document.getElementById('config').textContent);
  const $ = id => document.getElementById(id);
  const DUR = C.duration, END = C.end, OUT_FIRST = C.order === 'out';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- options (remembered when storage is available)
  const store = { get(k) { try { return localStorage.getItem(C.key + '.' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(C.key + '.' + k, v); } catch {} } };
  C.modes.forEach(m => $('mode').add(new Option(m.label, m.key)));
  const S = { mode: store.get('mode') || C.modes[0].key, split: store.get('split') || 'even', ripples: store.get('ripples') !== '0' && !reduceMotion };
  if (!C.modes.some(m => m.key === S.mode)) S.mode = C.modes[0].key;
  $('mode').value = S.mode; $('split').value = S.split; $('ripples').checked = S.ripples;
  let cycles = C.modes.find(m => m.key === S.mode).cycles;
  $('mode').onchange = e => { S.mode = e.target.value; store.set('mode', S.mode); cycles = C.modes.find(m => m.key === S.mode).cycles; };
  $('split').onchange = e => { S.split = e.target.value; store.set('split', S.split); };
  $('ripples').onchange = e => { S.ripples = e.target.checked; store.set('ripples', S.ripples ? '1' : '0'); };
  $('optBtn').onclick = () => { const o = $('options'); o.hidden = !o.hidden; $('optBtn').setAttribute('aria-expanded', String(!o.hidden)); };

  // ---- breath model. A cycle is [start, turn, end, wave]: the turn splits it evenly (or on the music); "longer out-breath" gives the out-breath 60%.
  function bsearch(arr, t, key) { let lo = 0, hi = arr.length - 1, ans = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (key(arr[m]) <= t) { ans = m; lo = m + 1; } else hi = m - 1; } return ans; }
  function breath(t) {
    const k = bsearch(cycles, t, c => c[0]);
    if (k < 0) return { v: OUT_FIRST ? 1 : 0, phase: 'before' };
    const [i, turn, e, wave] = cycles[k];
    if (t >= e || t >= END) return { v: 0, phase: 'rest' };
    const o = S.split === 'long' ? i + (OUT_FIRST ? 0.6 : 0.4) * (e - i) : turn;
    const first = t < o, p = first ? (t - i) / (o - i) : (t - o) / (e - o);
    const rising = first !== OUT_FIRST;   // in-breath
    return { v: rising ? (1 - Math.cos(Math.PI * p)) / 2 : (1 + Math.cos(Math.PI * p)) / 2, phase: rising ? 'in' : 'out', len: e - i, wave, remain: (first ? o : e) - t };
  }
  const envAt = t => { const v = C.env ? C.env[Math.floor(t / C.envStep)] : null; return v == null ? 0 : Math.max(0, (v + 60) / 60); };

  // ---- clock: audio when loaded, otherwise a silent preview clock
  const audio = new Audio(); audio.preload = 'auto';
  let hasAudio = false, vPlaying = false, vT = 0, anchorA = 0, anchorP = 0, lastSeen = -1, lastFrame = performance.now();
  function reanchor() { anchorA = audio.currentTime; anchorP = performance.now(); lastSeen = audio.currentTime; }
  function clockNow(pn) {
    if (!hasAudio) return vT;
    if (audio.paused) return audio.currentTime;
    const ct = audio.currentTime, est = anchorA + (pn - anchorP) / 1000 * audio.playbackRate;
    if (ct !== lastSeen) { lastSeen = ct; if (Math.abs(est - ct) > 0.08) { anchorA = ct; anchorP = pn; return ct; } }
    return est;
  }
  ['play', 'seeked', 'playing', 'ratechange'].forEach(ev => audio.addEventListener(ev, reanchor));
  ['play', 'pause', 'ended'].forEach(ev => audio.addEventListener(ev, updatePlayBtn));

  function hint(msg) { $('hint').textContent = msg || ''; $('hint').hidden = !msg; }
  // Try each source in turn; resolve with the first that the browser can play.
  function trySource(src) {
    return new Promise((res, rej) => {
      const done = ok => { audio.onloadedmetadata = audio.onerror = null; ok ? res() : rej(); };
      audio.onloadedmetadata = () => done(true); audio.onerror = () => done(false);
      audio.src = src;
    });
  }
  function loaded(name) {
    hasAudio = true; vPlaying = false;
    audio.currentTime = Math.min(Math.max(vT, 0), audio.duration - 1);
    hint(Math.abs(audio.duration - DUR) > 2 ? `“${name}” is ${fmt(audio.duration)}, not ${fmt(DUR)}: timing won't match.` : '');
    updatePlayBtn();
  }
  async function findBesideThisPage() {
    for (const name of C.files) {
      try { await trySource(encodeURIComponent(name)); loaded(name); return true; } catch {}
    }
    return false;
  }

  // a chosen file is kept in this browser, in case the MP3 is not beside the page
  const saved = (() => {
    let db;
    const open = () => db || (db = new Promise((res, rej) => {
      const r = indexedDB.open('gymnopedie-breathing', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('audio');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const run = (mode, fn) => open().then(d => new Promise((res, rej) => {
      const t = d.transaction('audio', mode), q = fn(t.objectStore('audio'));
      t.oncomplete = () => res(q.result); t.onerror = t.onabort = () => rej(t.error);
    }));
    return { get: () => run('readonly', s => s.get(C.key)), put: f => run('readwrite', s => s.put(f, C.key)) };
  })();
  async function useFile(f, fromSaved) {
    if (!f) return;
    if (audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
    try { await trySource(URL.createObjectURL(f)); } catch { hint(`Can't play “${f.name}”. Try an MP3.`); return; }
    loaded(f.name);
    if (!fromSaved) saved.put(f).catch(() => {});
  }
  $('file').addEventListener('change', e => useFile(e.target.files[0]));
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); useFile(e.dataTransfer.files[0]); });

  (async () => {
    if (await findBesideThisPage()) return;
    try { const f = await saved.get(); if (f && !hasAudio) { await useFile(f, true); if (hasAudio) return; } } catch {}
    hint(`Put “${C.files[0]}” in this page's folder, or choose it in Options.`);
  })();

  // ---- transport
  let wakeLock = null;
  async function keepAwake(on) {
    try { if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } else if (!on && wakeLock) { await wakeLock.release(); } } catch {}
  }
  function playing() { return hasAudio ? !audio.paused && !audio.ended : vPlaying; }
  function togglePlay() {
    stopFade(true);
    if (hasAudio) { if (audio.paused) audio.play().catch(() => hint('The browser blocked playback. Press Play again.')); else audio.pause(); }
    else vPlaying = !vPlaying;
    updatePlayBtn();
  }
  function updatePlayBtn() { const on = playing(); $('play').textContent = on ? 'Pause' : 'Play'; $('fadeBtn').disabled = !on && !fade; keepAwake(on); }

  // fade out: lower the volume over FADE seconds, then pause and put the volume back for the next Play
  const FADE = 8;
  let fade = null;
  function stopFade(restore) {
    if (!fade) return;
    cancelAnimationFrame(fade.raf); fade = null;
    if (restore) audio.volume = 1;
    $('fadeBtn').textContent = 'Fade out';
  }
  function fadeOut() {
    if (fade) { stopFade(true); updatePlayBtn(); return; }
    if (!playing()) return;
    const t0 = performance.now();
    $('fadeBtn').textContent = 'Cancel fade';
    const step = now => {
      const p = Math.min(1, (now - t0) / 1000 / FADE);
      audio.volume = (1 - p) ** 2;
      if (p < 1) { fade.raf = requestAnimationFrame(step); return; }
      stopFade(false);
      if (hasAudio) audio.pause(); else vPlaying = false;
      audio.volume = 1;
      updatePlayBtn();
    };
    fade = { raf: requestAnimationFrame(step) };
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => {});
  }
  $('play').onclick = togglePlay;
  $('fadeBtn').onclick = fadeOut;
  $('fsBtn').onclick = toggleFullscreen;
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  addEventListener('keydown', e => {
    if (/SELECT|BUTTON|TEXTAREA/.test(e.target.tagName) || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
  let seeking = false;
  $('seek').max = DUR; $('tEnd').textContent = fmt(Math.round(DUR));
  $('seek').addEventListener('input', e => { seeking = true; const t = +e.target.value; if (hasAudio) audio.currentTime = t; else vT = t; ripples.length = 0; });
  $('seek').addEventListener('change', () => { seeking = false; });
  (function paintSeek() {
    const pc = t => (t / DUR * 100).toFixed(2) + '%';
    const color = { a: 'var(--breath)', b: 'rgb(var(--breath-rgb) / .5)', w: 'rgb(var(--wave-rgb) / .55)', n: 'var(--line)' };
    $('seek').style.background = `linear-gradient(90deg, ${C.bands.map(([a, b, k]) => `${color[k]} ${pc(a)} ${pc(b)}`).join(', ')})`;
  })();

  // ---- drawing
  const cv = $('circle'), cx = cv.getContext('2d'), tv = $('trace'), tx = tv.getContext('2d');
  let col = {};
  function readTokens() {
    const cs = getComputedStyle(document.documentElement);
    col = { b: cs.getPropertyValue('--breath-rgb').trim(), w: cs.getPropertyValue('--wave-rgb').trim(), ink: cs.getPropertyValue('--ink').trim() };
  }
  readTokens();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
  const rgba = (rgb, a) => `rgb(${rgb} / ${a})`;
  function fit(c) {
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    const w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    return { w, h, d };
  }
  const ripples = [];
  let prevT = null, radiusNow = 0;

  function drawCircle(st, pn, alpha) {
    const { w, h, d } = fit(cv), cxp = w / 2, cyp = h / 2, s = Math.min(w, h);
    const rMin = s * 0.2, rMax = s * 0.47;
    const r = Math.sqrt(rMin * rMin + st.v * (rMax * rMax - rMin * rMin)); // area tracks lung volume
    radiusNow = r / s;
    cx.clearRect(0, 0, w, h);
    if (alpha <= 0) return;
    cx.save(); cx.globalAlpha = alpha;
    const tone = st.phase === 'in' || st.phase === 'out' ? (st.wave ? col.w : col.b) : col.w;
    cx.setLineDash([2 * d, 6 * d]); cx.lineWidth = d; cx.strokeStyle = rgba(col.w, .5);
    [rMin, rMax].forEach(rr => { cx.beginPath(); cx.arc(cxp, cyp, rr, 0, Math.PI * 2); cx.stroke(); });
    cx.setLineDash([]);
    if (shade > 0) {                                          // while stage light is on, keep the circle a calm window
      cx.save(); cx.globalAlpha = 0.7 * shade; cx.fillStyle = getComputedStyle(document.body).backgroundColor;
      cx.beginPath(); cx.arc(cxp, cyp, r, 0, Math.PI * 2); cx.fill(); cx.restore();
    }
    const g = cx.createRadialGradient(cxp, cyp, r * 0.1, cxp, cyp, r);
    g.addColorStop(0, rgba(tone, .10 + .30 * st.v)); g.addColorStop(1, rgba(tone, .22 + .25 * st.v));
    cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, r, 0, Math.PI * 2); cx.fill();
    cx.lineWidth = 2 * d; cx.strokeStyle = rgba(tone, .9); cx.stroke();
    for (let k = ripples.length - 1; k >= 0; k--) {
      const rp = ripples[k], age = (pn - rp.born) / 1000, life = rp.strong ? 2.6 : 1.6;
      if (age > life) { ripples.splice(k, 1); continue; }
      const rr = (rp.r0 + age * (rp.strong ? 0.05 : 0.035)) * s, a = (1 - age / life) * (rp.strong ? .55 : .3);
      cx.beginPath(); cx.arc(cxp, cyp, rr, 0, Math.PI * 2); cx.lineWidth = (rp.strong ? 2 : 1.2) * d; cx.strokeStyle = rgba(tone, a); cx.stroke();
    }
    cx.restore();
  }

  function drawTrace(t) {
    const { w, h, d } = fit(tv), pad = 8 * d, top = pad, bot = h - pad - 4 * d;
    const t0 = t - 10, t1 = t + 20, X = x => (x - t0) / (t1 - t0) * w, Y = v => bot - v * (bot - top);
    const step = 2 * d, at = x => t0 + x / w * (t1 - t0);
    tx.clearRect(0, 0, w, h);
    if (C.env) {
      tx.beginPath(); tx.moveTo(0, bot);
      for (let x = 0; x <= w; x += step) tx.lineTo(x, Y(envAt(at(x)) * 0.95));
      tx.lineTo(w, bot); tx.closePath(); tx.fillStyle = rgba(col.w, .38); tx.fill();
    }
    tx.fillStyle = rgba(col.w, .8);
    for (let k = Math.max(0, bsearch(C.ticks, t0, q => q[0])); k < C.ticks.length && C.ticks[k][0] < t1; k++) {
      const tall = C.ticks[k][1] && S.mode !== 'steady';
      tx.fillRect(X(C.ticks[k][0]), h - pad - (tall ? 10 : 5) * d, d, (tall ? 10 : 5) * d);
    }
    tx.beginPath();
    for (let x = 0; x <= w; x += step) { const v = breath(at(x)).v; x === 0 ? tx.moveTo(x, Y(v)) : tx.lineTo(x, Y(v)); }
    tx.lineWidth = 1.75 * d; tx.strokeStyle = rgba(col.b, .95); tx.stroke();
    if (!C.env) { tx.lineTo(w, bot); tx.lineTo(0, bot); tx.closePath(); tx.fillStyle = rgba(col.b, .14); tx.fill(); }
    const xn = X(t);
    tx.fillStyle = rgba(col.w, .12); tx.fillRect(0, 0, xn, h);
    tx.fillStyle = col.ink; tx.fillRect(xn - d / 2, top - 4 * d, d, bot - top + 8 * d);
    tx.beginPath(); tx.arc(xn, Y(breath(t).v), 4 * d, 0, Math.PI * 2); tx.fill();
  }

  function fmt(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
  const lastText = {};
  function setText(id, html) { if (lastText[id] !== html) { lastText[id] = html; $(id).innerHTML = html; } }

  // ---- stage light (optional): dark until C.light.from, rises over fadeIn, follows play, pause and Fade out, and
  // fades over fadeOut once the music stops at C.light.until. It is either a looping video (kind "video", which also
  // brightens with each in-breath) or a live Julia-set fractal (kind "fractal", whose shape breathes instead).
  const L = C.light;
  let layer = null, presence = 0, shade = 0;
  if (L && L.kind === 'fractal') layer = fractalLayer($('fractal'));
  else if (L) (async () => {
    const vid = $('light'); vid.hidden = false;
    for (const name of L.files) {
      try { await new Promise((res, rej) => { vid.onloadeddata = res; vid.onerror = rej; vid.src = encodeURIComponent(name); }); }
      catch { continue; }
      layer = (o, t, st) => {
        vid.style.opacity = (o * (st.phase === 'in' || st.phase === 'out' ? 0.6 + 0.4 * st.v : 0.6)).toFixed(3);
        if (o > 0.001) { if (vid.paused) vid.play().catch(() => {}); } else if (!vid.paused) vid.pause();
      };
      return;
    }
    vid.hidden = true;
  })();

  // The fractal is the Julia set of z -> z^2 + c with c = -1 + (r/4) e^(i th), inside the Mandelbrot set's period-2
  // bulb, so the shape always stays in one piece. th drifts slowly over minutes, turning the form from rounded to wavy;
  // r follows the breath, so the spirals wind in on the in-breath and open on the out-breath. Nothing zooms, pans or
  // rotates. Edges are lit by their distance to the set, in the page's accent colour.
  function fractalLayer(cv) {
    const gl = cv.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return null;
    const FRAG = `precision highp float;
      uniform vec2 uRes, uC; uniform float uView; uniform vec3 uBg, uAccent;
      void main() {
        vec2 z = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * uView, dz = vec2(1.0, 0.0);
        float logScale = 0.0, m2 = 0.0; bool esc = false;
        for (int i = 0; i < 240; i++) {
          dz = 2.0 * vec2(z.x * dz.x - z.y * dz.y, z.x * dz.y + z.y * dz.x);
          if (dot(dz, dz) > 1e16) { dz *= 1e-8; logScale += 18.420681; }
          z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + uC;
          m2 = dot(z, z);
          if (m2 > 1e6) { esc = true; break; }
        }
        vec3 col = uBg + uAccent * 0.02;
        if (esc) {
          float r = sqrt(m2), d = exp(log(0.5 * r * log(r)) - log(length(dz)) - logScale - log(uView / uRes.y));
          col = uBg + uAccent * (0.10 * exp(-d / 8.0) + 0.5 * exp(-d / 0.8));
        }
        gl_FragColor = vec4(col, 1.0);
      }`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; };
    const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'), fs = sh(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return null;
    const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = Object.fromEntries(['uRes', 'uC', 'uView', 'uBg', 'uAccent'].map(n => [n, gl.getUniformLocation(pr, n)]));
    const rgb = str => str.match(/[\d.]+/g).slice(0, 3).map(x => x / 255);
    const F = L.fractal;
    let last = -1e9;
    cv.hidden = false;
    return (o, t, st, pn) => {
      cv.style.opacity = o.toFixed(3);
      if (o < 0.001 || pn - last < 33) return;              // about 30 drawings a second is plenty for this pace
      last = pn;
      const d = Math.min(devicePixelRatio || 1, 2) * F.res;
      const w = Math.max(1, Math.round(cv.clientWidth * d)), h = Math.max(1, Math.round(cv.clientHeight * d));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
      const th = F.th + F.thAmp * Math.sin(2 * Math.PI * (t - L.from) / F.thPeriod);
      const r = F.rOut + (F.rIn - F.rOut) * (st.phase === 'in' || st.phase === 'out' ? st.v : 0);
      gl.uniform2f(U.uRes, w, h); gl.uniform2f(U.uC, -1 + 0.25 * r * Math.cos(th), 0.25 * r * Math.sin(th));
      gl.uniform1f(U.uView, F.view);
      gl.uniform3fv(U.uBg, rgb(getComputedStyle(document.body).backgroundColor)); gl.uniform3fv(U.uAccent, rgb(col.b));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
  }

  function drawLight(t, st, dt, pn) {
    if (!layer) return;
    const target = playing() ? (hasAudio ? audio.volume : 1) : 0;
    presence += (target - presence) * Math.min(1, dt / (target > presence ? 1.5 : 0.8));
    const level = Math.min(1, Math.max(0, (t - L.from) / L.fadeIn)) * Math.min(1, Math.max(0, (L.until + L.fadeOut - t) / L.fadeOut));
    const o = level * presence * L.max;
    shade = o / L.max;
    layer(o, t, st, pn);
    document.body.classList.toggle('lit', o > 0.02);
  }

  // ---- body cues (optional): for a while the circle gives way to a figure, either a slow body scan (a light that
  // travels head to feet and back over several breaths: it rests while the in-breath brightens the area, then glides a
  // step on the out-breath) or a heart check-in (a warm glow at the heart that swells with the breath or a slow beat)
  const B = C.body, bodyImg = B ? Object.assign(new Image(), { src: 'data:image/png;base64,' + B.png }) : null;
  const off = document.createElement('canvas'), ox = off.getContext('2d');
  if (B) {
    $('bodyOpts').hidden = false;
    S.bodyOn = store.get('bodyOn') !== '0'; S.sweep = +(store.get('sweep') || B.sweep); S.pulse = store.get('pulse') || B.pulse;
    $('bodyOn').checked = S.bodyOn; $('sweep').value = String(S.sweep); $('pulse').value = S.pulse;
    $('bodyOn').onchange = e => { S.bodyOn = e.target.checked; store.set('bodyOn', S.bodyOn ? '1' : '0'); };
    $('sweep').onchange = e => { S.sweep = +e.target.value; store.set('sweep', String(S.sweep)); };
    $('pulse').onchange = e => { S.pulse = e.target.value; store.set('pulse', S.pulse); };
  }
  const ramp = (t, a, b, f) => Math.min(1, Math.max(0, (t - a) / f)) * Math.min(1, Math.max(0, (b - t) / f));
  function bodyWeights(t) {                                // how present the figure is, and how much is scan or heart
    const w = { p: 0, scan: 0, heart: 0, seg: null };
    if (!B || !S.bodyOn) return w;
    for (const [a, b] of B.blocks) w.p = Math.max(w.p, ramp(t, a, b, 3));
    for (const seg of B.segments) {
      const v = ramp(t, seg[1], seg[2], 2);
      if (seg[0] === 'scan' && v >= w.scan && v > 0) { w.scan = v; w.seg = seg; } else if (seg[0] === 'heart') w.heart = Math.max(w.heart, v);
    }
    return w;
  }
  function cycleAt(t) {
    const k = bsearch(cycles, t, c => c[0]);
    if (k < 0) return null;
    const [i, turn, e] = cycles[k];
    return { k, i, e, o: S.split === 'long' ? i + (OUT_FIRST ? 0.6 : 0.4) * (e - i) : turn };
  }
  function scanPos(t, seg) {                              // 0 at the head, 1 at the feet
    const c = cycleAt(t), c0 = cycleAt(seg[1] + 0.01);
    if (!c || !c0) return B.start === 'head' ? 0 : 1;
    const n = c.k - c0.k, within = ((n % S.sweep) + S.sweep) % S.sweep, pass = Math.floor(n / S.sweep);
    const ease = q => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, q)))) / 2;
    let glide;                                            // the step happens on the out-breath
    if (B.move === 'smooth') glide = (t - c.i) / (c.e - c.i);
    else if (!OUT_FIRST) glide = t < c.o ? 0 : ease((t - c.o) / (c.e - c.o));
    else glide = t < c.o ? ease((t - c.i) / (c.o - c.i)) : 1;
    const f = (within + glide) / S.sweep, down = (pass % 2 === 0) === (B.start === 'head');
    return down ? f : 1 - f;
  }
  function glowAt(gx, gy, rad, a, core, edge) {
    const rg = cx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    rg.addColorStop(0, `rgb(${core} / ${a})`); rg.addColorStop(0.35, `rgb(${edge} / ${a * 0.45})`); rg.addColorStop(1, `rgb(${edge} / 0)`);
    cx.fillStyle = rg; cx.beginPath(); cx.arc(gx, gy, rad, 0, Math.PI * 2); cx.fill();
  }
  function litOutline(maskFn, glow, W, H, x0, y0, fw, fh, d) {   // the outline where the mask allows, added with a soft glow
    if (off.width !== W || off.height !== H) { off.width = W; off.height = H; }
    ox.globalCompositeOperation = 'source-over'; ox.clearRect(0, 0, W, H);
    ox.drawImage(bodyImg, x0, y0, fw, fh);
    ox.globalCompositeOperation = 'destination-in'; maskFn(ox);
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.shadowColor = glow; cx.shadowBlur = 12 * d; cx.drawImage(off, 0, 0); cx.restore();
  }
  const heat = B ? B.points.map(() => 0) : [], pulseRings = [];
  let prevScan = null, prevPulseK = null, prevBodyT = null, figBottom = 0, cueShift = 0;
  function drawBody(t, st, dt, w) {
    if (!B || w.p <= 0 || !bodyImg.complete) { prevBodyT = t; return; }
    const { w: W, h: H, d } = fit(cv), [FW, FH] = B.size, TOP = 8, BOT = FH - 6;
    // the figure and the guidance line below it are centred together, close to each other
    const room = 104 * d, s = Math.min((H - room) * 0.96 / FH, W * 0.8 / FW), fw = FW * s, fh = FH * s;
    const x0 = (W - fw) / 2, y0 = Math.max(H * 0.01, (H - fh - room) / 2);
    figBottom = (y0 + fh) / d;                           // in CSS pixels, for placing the guidance line
    const A = col.b, Lt = B.light, Hr = B.heartRgb, Hc = B.heartCore;
    const forward = prevBodyT !== null && t > prevBodyT && t - prevBodyT < 0.5; prevBodyT = t;
    cx.save();
    if (shade > 0) {                                      // over stage light, a tall soft dark oval behind the figure and the cue
      const bg = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g).slice(0, 3).join(' ');
      const ry = H * 0.62, rx = Math.max(fw * 1.5, 230 * d);
      cx.save(); cx.translate(W / 2, H * 0.55); cx.scale(rx / ry, 1);
      const g = cx.createRadialGradient(0, 0, 0, 0, 0, ry);
      g.addColorStop(0, `rgb(${bg} / ${0.85 * shade * w.p})`); g.addColorStop(0.6, `rgb(${bg} / ${0.7 * shade * w.p})`); g.addColorStop(1, `rgb(${bg} / 0)`);
      cx.fillStyle = g; cx.fillRect(-ry, -ry, ry * 2, ry * 2); cx.restore();
    }
    cx.globalAlpha = 0.3 * w.p; cx.drawImage(bodyImg, x0, y0, fw, fh); cx.globalAlpha = w.p;

    if (w.scan > 0 && w.seg) {
      const scan = TOP + (BOT - TOP) * scanPos(t, w.seg), sy = y0 + scan * s;
      const dir = prevScan === null ? 0 : Math.sign(scan - prevScan); prevScan = scan;   // +1 moving down
      const swell = (0.55 + 0.45 * (st.phase === 'in' || st.phase === 'out' ? st.v : 0)) * w.scan;
      const ahead = 50 * s, behind = (dir === 0 ? 50 : 130) * s;
      litOutline(o => {
        const top = sy - (dir > 0 ? behind : ahead), bot = sy + (dir > 0 ? ahead : behind);
        const g = o.createLinearGradient(0, top, 0, bot), mid = (sy - top) / (bot - top);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(mid, `rgba(0,0,0,${swell})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        o.fillStyle = g; o.fillRect(0, 0, W, H);
      }, `rgb(${A} / .9)`, W, H, x0, y0, fw, fh, d);
      B.points.forEach(([, px, py], i) => {
        const target = Math.exp(-(((py - scan) / 40) ** 2)) * swell;
        heat[i] += (target - heat[i]) * Math.min(1, dt / (target > heat[i] ? 0.4 : 2.5));
        glowAt(x0 + px * s, y0 + py * s, 26 * s, (0.07 + 0.8 * heat[i]), Lt, A);
      });
      const half = FW * 0.65 * s, mx = W / 2;
      cx.save(); cx.globalCompositeOperation = 'lighter';
      for (const [h, a] of [[22, 0.06], [8, 0.16], [2.2, 0.8]]) {
        const lg = cx.createLinearGradient(mx - half, 0, mx + half, 0), aa = a * (0.7 + 0.3 * swell) * w.scan;
        lg.addColorStop(0, `rgb(${Lt} / 0)`); lg.addColorStop(0.5, `rgb(${Lt} / ${aa})`); lg.addColorStop(1, `rgb(${Lt} / 0)`);
        cx.fillStyle = lg; cx.filter = h > 3 ? `blur(${(h * s * 0.6).toFixed(1)}px)` : 'none';
        const vg = h * s * 2.2; cx.fillRect(mx - half, sy - vg / 2, half * 2, vg);
      }
      cx.filter = 'none'; cx.restore();
    } else { prevScan = null; heat.fill(0); }

    if (w.heart > 0) {
      let P, k;
      if (S.pulse === 'breath') { P = st.phase === 'in' || st.phase === 'out' ? st.v : 0; const c = cycleAt(t); k = c ? c.k : -1; }
      else { const T = 60 / 55, q = ((t % T) + T) % T, bump = (c, wd) => Math.exp(-(((q - c) / wd) ** 2)); P = 0.75 * bump(0.12, 0.09) + 0.45 * bump(0.38, 0.09); k = Math.floor(t / T); }
      if (forward && prevPulseK !== null && k !== prevPulseK) pulseRings.push({ born: t });
      prevPulseK = k;
      const hx = x0 + B.heart[0] * s, hy = y0 + B.heart[1] * s, life = S.pulse === 'breath' ? 5 : 3;
      cx.globalAlpha = w.p * w.heart;
      litOutline(o => {
        const rad = (110 + 50 * P) * s, g = o.createRadialGradient(hx, hy, 0, hx, hy, rad);
        g.addColorStop(0, `rgba(0,0,0,${0.35 + 0.4 * P})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        o.fillStyle = g; o.fillRect(0, 0, W, H);
      }, `rgb(${Hr} / .9)`, W, H, x0, y0, fw, fh, d);
      for (let i = pulseRings.length - 1; i >= 0; i--) {
        const age = t - pulseRings[i].born;
        if (age < 0 || age > life) { pulseRings.splice(i, 1); continue; }
        const rr = (24 + 90 * age / life) * s, a = (1 - age / life) * (S.pulse === 'breath' ? 0.22 : 0.1);
        cx.beginPath(); cx.arc(hx, hy, rr, 0, Math.PI * 2); cx.lineWidth = 1.5 * d; cx.strokeStyle = `rgb(${Hr} / ${a})`; cx.stroke();
      }
      cx.save(); cx.globalCompositeOperation = 'lighter';
      glowAt(hx, hy, (38 + 16 * P) * s, 0.28 + 0.5 * P, Hc, Hr);
      glowAt(hx, hy, (90 + 30 * P) * s, 0.08 + 0.12 * P, Hr, Hr);
      cx.restore();
    } else { pulseRings.length = 0; prevPulseK = null; }
    cx.restore();
  }

  // ---- guidance (optional): short written instructions under the breathing cue, each held for a few breaths
  const NOTES = C.notes || null;
  if (NOTES) {
    $('notesOpt').hidden = false; S.notesOn = store.get('notesOn') !== '0'; $('notesOn').checked = S.notesOn;
    $('notesOn').onchange = e => { S.notesOn = e.target.checked; store.set('notesOn', S.notesOn ? '1' : '0'); };
  }
  function noteAt(t) {
    if (!NOTES || !S.notesOn) return null;
    const k = bsearch(NOTES, t, n => n[0]);
    if (k < 0 || t >= NOTES[k][1]) return null;
    const [a, b, text] = NOTES[k], fade = 1.2;
    return { text, o: (a <= 0.01 ? 1 : Math.min(1, (t - a) / fade)) * Math.min(1, Math.max(0, (b - t) / fade)) };
  }
  let noteShown = null;
  function showNote(text, o) {
    if (text !== noteShown) { $('cueNote').textContent = text; noteShown = text; }
    $('cueNote').style.opacity = (0.85 * o).toFixed(3);
  }

  function frame(pn) {
    const dt = Math.min(0.1, (pn - lastFrame) / 1000); lastFrame = pn;
    if (!hasAudio && vPlaying) { vT += dt; if (vT >= DUR) vT = 0; }
    const t = clockNow(pn), st = breath(t);
    if (prevT !== null && t > prevT && t - prevT < 0.3 && S.ripples && t < END) {
      const k = bsearch(C.ripples, t, q => q[0]);
      if (k >= 0 && C.ripples[k][0] > prevT) ripples.push({ born: pn, r0: radiusNow, strong: !!C.ripples[k][1] && S.mode !== 'steady' });
    }
    prevT = t;
    drawLight(t, st, dt, pn);
    const bw = bodyWeights(t);
    const note = noteAt(t);
    // the circle gives way to the figure, to the stage light, and to a closing line after the music
    drawCircle(st, pn, (1 - bw.p) * (L ? Math.max(0, 1 - 2 * shade) : 1) * (t >= END && note ? 0 : 1));
    drawBody(t, st, dt, bw);
    drawTrace(t);
    // at the very start of an out-first piece, ask for a full breath before Play
    const ready = OUT_FIRST && t < 0.05 && !playing();
    const word = ready || st.phase === 'before' ? C.beforeWord : st.phase === 'in' ? 'Breathe in' : st.phase === 'out' ? 'Breathe out' : 'Rest';
    setText('cueWord', word);
    setText('cueCount', st.remain != null && !ready ? `${Math.ceil(st.remain)}` : '&nbsp;');
    if (B || L) {
      // the breath words and count step aside while the figure or the stage light carries the breath, and after the
      // music once a closing line is showing
      const o = (B ? 1 - bw.p : 1) * Math.max(0, 1 - 2 * shade) * (t >= END && note ? 0 : 1);
      $('cueWord').style.opacity = $('cueCount').style.opacity = o.toFixed(3);
    }
    if (B) {                                                // with the figure shown, the guidance line sits just below it
      const dialTop = $('cue').getBoundingClientRect().top - cueShift;
      const noteTop = $('cueNote').getBoundingClientRect().top - cueShift - dialTop;
      cueShift = bw.p > 0 ? bw.p * (figBottom + 10 - noteTop) : 0;
      $('cue').style.transform = cueShift ? `translateY(${cueShift.toFixed(1)}px)` : '';
    }
    if (note) showNote(note.text, note.o);
    else if (B && !NOTES && bw.heart > 0) showNote(B.note, bw.p * bw.heart);
    else showNote(noteShown || '', 0);
    setText('rate', st.len ? `<b>${(60 / st.len).toFixed(1)}</b> breaths / min` : '&nbsp;');
    setText('tNow', fmt(t));
    if (!seeking) $('seek').value = t.toFixed(1);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
